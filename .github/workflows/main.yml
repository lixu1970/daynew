name: 每日新闻自动更新

on:
  schedule:
    # 北京时间每天06:00 = UTC前一天22:00
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: 读取网站文件
        uses: actions/checkout@v4

      - name: 安装Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装程序需要的软件
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: 获取最新新闻并生成网页
        run: python update_news.py

      - name: 保存最新新闻
        run: |
          git config user.name "daynew-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "自动更新每日新闻"
          git push
