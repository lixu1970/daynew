<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新闻</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f6f8;
  color: #222;
  font-family: -apple-system, BlinkMacSystemFont,
               "PingFang SC", "Microsoft YaHei", sans-serif;
  line-height: 1.75;
}

.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 20px 16px 50px;
}

.header {
  text-align: center;
  padding: 22px 10px 18px;
}

.header h1 {
  margin: 0;
  font-size: 32px;
}

.date {
  margin-top: 8px;
  color: #666;
  font-size: 17px;
}

.section-title {
  margin: 22px 0 12px;
  padding-left: 10px;
  border-left: 5px solid #333;
  font-size: 25px;
  font-weight: bold;
}

.news {
  background: white;
  margin-bottom: 14px;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.news h2 {
  margin: 0 0 8px;
  font-size: 21px;
  line-height: 1.45;
}

.news p {
  margin: 0;
  font-size: 18px;
  line-height: 1.8;
}

.footer {
  text-align: center;
  color: #888;
  font-size: 14px;
  margin-top: 30px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>每日新闻</h1>
    <div class="date">2026年9月17日</div>
  </div>

  <div class="section-title">国内新闻 · 10条</div>

  <div class="news">
    <h2>1．一箭双星！我国成功发射天仪51、52星</h2>
    <p>
      北京时间2026年9月17日，我国成功完成相关卫星发射任务，
      卫星顺利进入预定轨道。
    </p>
  </div>

  <div class="news">
    <h2>2．我国成功发射卫星互联网低轨卫星</h2>
    <p>
      卫星顺利进入预定轨道，发射任务取得成功。
    </p>
  </div>

  <div class="news">
    <h2>3．今日国内重要新闻</h2>
    <p>
      这里放第三条新闻的完整内容。
    </p>
  </div>

  <!-- 第4～10条国内新闻继续按照上面的格式添加 -->


  <div class="section-title">国际新闻 · 10条</div>

  <div class="news">
    <h2>1．今日国际重要新闻</h2>
    <p>
      这里放第一条国际新闻的完整内容。
    </p>
  </div>

  <div class="news">
    <h2>2．今日国际重要新闻</h2>
    <p>
      这里放第二条国际新闻的完整内容。
    </p>
  </div>

  <!-- 第3～10条国际新闻继续按照上面的格式添加 -->


  <div class="footer">
    每日新闻 · daynew
  </div>

</div>

</body>
</html>
